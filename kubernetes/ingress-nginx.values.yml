controller:
  # only run on nodes still assigned to ingress-nginx during the Traefik migration;
  # see traefik.values.yml and kubernetes/README.md for the node-label mechanism
  nodeSelector:
    qb.con2.fi/ingress-controller: nginx

  # run on every node
  kind: DaemonSet

  # needs to be on host network in order for hostPort to work on CNI
  hostNetwork: true

  # allow traffic into cluster using a host port
  daemonset:
    useHostPort: true

  # while we use hostPort in hostNetwork to access ingress from outside,
  # a service is still necessary, otherwise the controller will fail to boot
  service:
    type: ClusterIP

  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
