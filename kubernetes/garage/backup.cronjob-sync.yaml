# Copies buckets on garage.con2.fi into the garage-backup bucket on piilo-s3.tracon.fi
# every hour: the media originals (`pictures/` prefix) of the edegal site buckets, and
# whole buckets for apps whose every object is irreplaceable (Kompassi). Edegal previews,
# thumbnails and in-flight uploads are left out: the media worker regenerates the former
# from the originals, and the latter are transient. Uses `rclone copy`, never `sync` - this job
# must never be given a delete-capable verb, since Garage has no bucket versioning to
# fall back on if it deleted something it shouldn't have. Version history for
# overwritten/deleted objects instead comes from --backup-dir, which moves the previous
# copy aside instead of clobbering it. The source key is read-only on Garage's side too
# (see backup.README.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-backup-sync
  namespace: garage-backup
spec:
  # Off the top of the hour, when other jobs against piilo tend to run.
  schedule: "30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Set suspend: true before a bulk arrival at the source (the edegal picture migration), run
  # the first copy by hand without the deadline below, then unsuspend; see backup.README.md.
  jobTemplate:
    spec:
      backoffLimit: 1
      # Sized for steady-state hourly deltas, not the initial copy. Kept under the 1h
      # schedule so a hung run is killed before it could overlap the next one's slot
      # (concurrencyPolicy: Forbid would just skip that slot otherwise, silently
      # stretching the effective RPO). Re-check after the first scheduled runs.
      activeDeadlineSeconds: 3000
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: rclone
              image: rclone/rclone:1.75.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  # Lower than the rclone defaults (4/8) - this is a background
                  # off-site backup, not a latency-sensitive transfer, and fewer
                  # concurrent workers means fewer simultaneous connections to
                  # piilo contributing to TIME_WAIT/conntrack churn.
                  copy() {
                    rclone copy "garage_backup_src:$1" "garage_backup_dst:garage-backup/$2/current/$3" \
                      --backup-dir "garage_backup_dst:garage-backup/$2/versions/$ts/$3" \
                      --fast-list --transfers 2 --checkers 4
                  }
                  # One site bucket per edegal deployment; add here when a site joins.
                  for site in larppikuvat conikuvat; do
                    echo "syncing $site originals"
                    copy "$site/pictures" "$site" pictures
                  done
                  # Whole buckets: apps whose every object is irreplaceable.
                  for bucket in kompassidev kompassi outline outlinetracon outlinekotae outlinekuplii outlineropecon archive redmine; do
                    echo "syncing $bucket"
                    copy "$bucket" "$bucket" ""
                  done
                  # Archived static sites, one bucket per hostname. Must match `sites` in
                  # Hobby/static chart/values-production.yaml (bin/garage-buckets.sh there
                  # grants the reader key) and the prune job's list.
                  for bucket in \
                    2005.tracon.fi 2006.tracon.fi 2007.tracon.fi 2008.tracon.fi 2009.tracon.fi \
                    2010.tracon.fi 2011.tracon.fi 2012.tracon.fi 2013.tracon.fi 2014.tracon.fi \
                    2015.tracon.fi 2016.tracon.fi 2017.tracon.fi 2018.tracon.fi 2019.tracon.fi \
                    2020.tracon.fi 2021.tracon.fi 2022.tracon.fi 2023.tracon.fi 2024.tracon.fi \
                    2015.hitpoint.tracon.fi 2016.hitpoint.tracon.fi 2017.hitpoint.tracon.fi \
                    2019.hitpoint.tracon.fi 2020.hitpoint.tracon.fi 2023.hitpoint.tracon.fi \
                    2016.animecon.fi media.tracon.fi blog.tracon.fi r.tracon.fi con2.fi tracontent-media; do
                    echo "syncing $bucket"
                    copy "$bucket" "$bucket" ""
                  done
              env:
                - name: RCLONE_CONFIG
                  value: /config/rclone/rclone.conf
                # nginx on piilo terminates TLS with http2 enabled, and Go's HTTP/2
                # client can't retry a PutObject after a GOAWAY arrives mid-upload
                # (streamed request bodies have no Request.GetBody) - forcing
                # HTTP/1.1 avoids that failure mode entirely.
                - name: RCLONE_DISABLE_HTTP2
                  value: "true"
              envFrom:
                - secretRef:
                    name: garage-backup-rclone-credentials
              volumeMounts:
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: rclone-config
              configMap:
                name: garage-backup-rclone-config
