apiVersion: v1
kind: ServiceAccount
metadata:
  name: qb-arc-runners
  namespace: arc-runners
---
---
# NOTE: this policy is still WIP, we're not even there yet
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actions-runner
rules:
- apiGroups: ["", "apps", "networking.k8s.io", "extensions", "batch"] # "" indicates the core API group
  resources: ["deployments", "replicasets", "services", "configmaps", "secrets", "ingresses", "persistentvolumeclaims", "cronjobs", "jobs", "statefulsets", "pods"]
  verbs: ["get", "watch", "list", "patch", "update", "delete", "create"]

# Gateway API's Gateway lives in its own API group (gateway.networking.k8s.io), separate
# from Ingress's networking.k8s.io above - added ahead of need for the eventual per-app
# Ingress -> Gateway API migration (see traefik migration notes).
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "referencegrants"]
  verbs: ["get", "watch", "list", "patch", "update", "delete", "create"]

# Apps on Gateway API declare an explicit Certificate (cert-manager has no Gateway API
# support in this cluster, so the Ingress annotation shortcut is not available).
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "watch", "list", "patch", "update", "delete", "create"]

# An HTTPRoute can only reference Traefik Middlewares in its own namespace, so apps on
# Gateway API ship their own instead of using the shared ones in `default`.
- apiGroups: ["traefik.io"]
  resources: ["middlewares"]
  verbs: ["get", "watch", "list", "patch", "update", "delete", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qb-actions-runner
subjects:
- kind: ServiceAccount
  name: qb-arc-runners
  namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: actions-runner
  apiGroup: rbac.authorization.k8s.io
