apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: yhteys@con2.fi
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    # Enable the HTTP-01 challenge provider
    #
    # ingress-nginx -> Traefik migration complete (2026-08-03): all 4 nodes now run
    # Traefik, so this is the sole, unconditional (empty-selector) default solver.
    # The nginx solver has been removed - see infrastructure/kubernetes/README.md.
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik