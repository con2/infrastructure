# Nightly base backup of the postgres Cluster to piilo-s3 through the Barman Cloud plugin.
# WAL archiving is continuous regardless of this schedule; base backups bound how far back a
# restore has to replay. See README.md.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  namespace: postgres
spec:
  # Six fields: the first is seconds. 03:30 UTC, before the piilo mirrors' daily prunes.
  schedule: "0 30 3 * * *"
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Backups are garbage-collected together with this ScheduledBackup, not with the Cluster.
  backupOwnerReference: self
  immediate: true
